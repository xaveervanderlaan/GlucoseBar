name: Release

# Push a tag like v1.4.1 (or v1.4.1-rc1 for a pre-release) to build GlucoseBar
# and publish it as a GitHub release with GlucoseBar.dmg and GlucoseBar.zip.
#
# Run it by hand from the Actions tab to get a test build as a workflow
# artifact without publishing anything.
#
# Signing is picked from the repository secrets that are set:
#   none                                   ad-hoc signed; macOS asks users to
#                                          approve it on first launch
#   MACOS_CERTIFICATE_P12                  signed with Developer ID
#   MACOS_CERTIFICATE_PASSWORD
#   APPLE_TEAM_ID
#   ...plus NOTARY_KEY_P8                  also notarized and stapled, so it
#   NOTARY_KEY_ID                          opens without any warning
#   NOTARY_ISSUER_ID

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the test build, e.g. 1.4.1. Leave empty to use the project's version."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    # Intel runner on purpose: jobs on the arm64 macos-26 runner sat unassigned
    # until GitHub cancelled them ("not acquired by Runner ... after multiple
    # attempts"). The build is universal either way. Switch back to macos-26
    # once arm64 capacity recovers, as GitHub plans to retire the Intel images.
    runs-on: macos-26-intel
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Work out version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            version="${INPUT_VERSION#v}"
          else
            version="$(xcodebuild -project GlucoseBar.xcodeproj -target GlucoseBar -configuration Release \
              -showBuildSettings 2>/dev/null | awk -F ' = ' '$1 ~ /^ *MARKETING_VERSION$/ { print $2; exit }')"
          fi
          if [[ "$version" == *-* ]]; then prerelease=true; else prerelease=false; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Building version $version (pre-release: $prerelease)"

      - name: Set up signing
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          if [[ -z "$CERTIFICATE_P12" || -z "$APPLE_TEAM_ID" ]]; then
            echo "::warning::No Developer ID secrets set, so this build is ad-hoc signed and not notarized."
            echo "SIGNING_MODE=adhoc" >> "$GITHUB_ENV"
            exit 0
          fi

          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          {
            echo "TEAM_ID=$APPLE_TEAM_ID"
            echo "KEYCHAIN=$keychain"
          } >> "$GITHUB_ENV"

          if [[ -z "$NOTARY_KEY_P8" || -z "$NOTARY_KEY_ID" || -z "$NOTARY_ISSUER_ID" ]]; then
            echo "::warning::No notarization secrets set, so this build is signed but not notarized."
            echo "SIGNING_MODE=signed" >> "$GITHUB_ENV"
            exit 0
          fi

          printf '%s\n' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary-key.p8"
          {
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary-key.p8"
            echo "NOTARY_KEY_ID=$NOTARY_KEY_ID"
            echo "NOTARY_ISSUER_ID=$NOTARY_ISSUER_ID"
            echo "SIGNING_MODE=notarized"
          } >> "$GITHUB_ENV"

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
          OUTPUT_DIR: ${{ github.workspace }}/dist
        run: scripts/build-release.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlucoseBar-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "## Install"
            echo
            echo "Download **GlucoseBar.dmg**, open it and drag GlucoseBar into Applications."
            echo "Requires macOS 14 or later."
            if [[ "$SIGNING_MODE" != "notarized" ]]; then
              echo
              echo "This build is not notarized by Apple, so macOS blocks it the first time you open it."
              echo "Either run this in Terminal after installing:"
              echo
              echo '```'
              echo 'xattr -dr com.apple.quarantine /Applications/GlucoseBar.app'
              echo '```'
              echo
              echo "or try to open it once, then go to System Settings → Privacy & Security and click **Open Anyway**."
            fi
            echo
          } > "$notes"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, replacing its files."
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --verify-tag \
              --generate-notes \
              --notes-file "$notes" \
              --prerelease="$PRERELEASE"
          fi

      - name: Clean up signing
        if: always()
        run: |
          if [[ -n "${KEYCHAIN:-}" ]]; then
            security delete-keychain "$KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/notary-key.p8"
